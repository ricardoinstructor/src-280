apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: cooperativa-project-template
objects:
  - apiVersion: project.openshift.io/v1
    kind: Project
    metadata:
      name: ${PROJECT_NAME}
      annotations:
        openshift.io/description: ${PROJECT_DESCRIPTION}
        openshift.io/display-name: ${PROJECT_DISPLAYNAME}
        openshift.io/requester: ${PROJECT_REQUESTING_USER}
    spec: {}
    status: {}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: admin
      namespace: ${PROJECT_NAME}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: admin
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: User
        name: ${PROJECT_ADMIN_USER}
  - apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: cooperativa-quota
      namespace: ${PROJECT_NAME}
    spec:
      hard:
        requests.cpu: "2"
        limits.cpu: "4"
        requests.memory: 2Gi
        limits.memory: 4Gi
        pods: "10"
        services: "5"
        openshift.io/routes: "3"
  - apiVersion: v1
    kind: LimitRange
    metadata:
      name: cooperativa-limits
      namespace: ${PROJECT_NAME}
    spec:
      limits:
        - type: Container
          defaultRequest:
            cpu: 100m
            memory: 64Mi
          default:
            cpu: 200m
            memory: 128Mi
          max:
            cpu: 500m
            memory: 256Mi
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: default-deny
      namespace: ${PROJECT_NAME}
    spec:
      podSelector: {}
      policyTypes: ["Ingress"]
parameters:
  - name: PROJECT_NAME
  - name: PROJECT_DISPLAYNAME
  - name: PROJECT_DESCRIPTION
  - name: PROJECT_ADMIN_USER
  - name: PROJECT_REQUESTING_USER
