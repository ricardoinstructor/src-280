apiVersion: v1
kind: Namespace
metadata:
  name: curso-t2-a
  labels:
    equipo: cooperativa
---
apiVersion: v1
kind: Namespace
metadata:
  name: curso-t2-b
  labels:
    equipo: cooperativa
---
apiVersion: quota.openshift.io/v1
kind: ClusterResourceQuota
metadata:
  name: cooperativa-total
spec:
  selector:
    labels:
      matchLabels:
        equipo: cooperativa
  quota:
    hard:
      pods: "20"
      requests.cpu: "4"
      requests.memory: 8Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: carga-a
  namespace: curso-t2-a
  labels: {app: carga}
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: quay.io/ricardo_instructor_formacion/cooperativa-web:client-1.0
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Pod
metadata:
  name: carga-b
  namespace: curso-t2-b
  labels: {app: carga}
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: quay.io/ricardo_instructor_formacion/cooperativa-web:client-1.0
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
