apiVersion: v1
kind: Pod
metadata:
  name: sin-recursos
  namespace: curso-t1
  labels: {app: sin-recursos}
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: __COOP_CLIENT__
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
