apiVersion: v1
kind: ResourceQuota
metadata:
  name: cooperativa-quota
  namespace: curso-t1
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "10"
    services: "5"
    openshift.io/routes: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cooperativa-limits
  namespace: curso-t1
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 256Mi
