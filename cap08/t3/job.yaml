apiVersion: batch/v1
kind: Job
metadata:
  name: scale-up
  namespace: curso-t3
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: autoescala
      restartPolicy: Never
      containers:
        - name: scale-up
          image: __COOP_JOB__
          env:
            - {name: NAMESPACE, value: curso-t3}
            - {name: DEPLOYMENT, value: panel}
            - {name: REPLICAS, value: "3"}
