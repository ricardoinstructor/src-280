# Patch estratégico declarativo para Kustomize.
# Copia este fichero al directorio del overlay y referéncialo así:
#   patches:
#     - path: patch-env.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooperativa-web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: APP_ENV
              value: produccion
