# Patch estratégico declarativo para Kustomize.
# Se referencia desde un overlay con:
#   patches:
#     - path: ../../patch/declarativo-patch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooperativa-web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: APP_ENV
              value: produccion
