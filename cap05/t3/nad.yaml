apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-eth10
  namespace: curso-t3
spec:
  config: '{"cniVersion":"0.4.0","type":"macvlan","master":"eth10","mode":"bridge","ipam":{"type":"static","addresses":[{"address":"192.168.126.240/23","gateway":"192.168.126.1"}]}}'
---
apiVersion: v1
kind: Pod
metadata:
  name: multi-homed
  namespace: curso-t3
  labels: {app: multi-homed}
  annotations:
    k8s.v1.cni.cncf.io/networks: macvlan-eth10
spec:
  containers:
    - name: web
      image: quay.io/ricardo_instructor_formacion/cooperativa-web:web-1.0
      ports: [{containerPort: 8080}]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
