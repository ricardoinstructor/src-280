apiVersion: v1
kind: Namespace
metadata:
  name: curso-t2-datos
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: red-datos
  namespace: curso-t2-datos
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets: ["10.43.0.0/24"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: curso-t2-datos
  labels: {app: db}
spec:
  replicas: 2
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: web
          image: __COOP_IMAGE__
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: udn-client
  namespace: curso-t2-datos
  labels: {app: udn-client}
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: __COOP_CLIENT__
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
