apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata:
  name: metallb
  namespace: metallb-system
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: cooperativa-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.126.200-192.168.126.220
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
