apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cooperativa-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cooperativa-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cooperativa-reader
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: cooperativa-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cooperativa-ops-view
  namespace: curso-t2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: cooperativa-ops
