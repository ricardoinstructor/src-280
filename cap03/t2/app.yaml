apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel
  labels:
    app: panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panel
  template:
    metadata:
      labels:
        app: panel
    spec:
      containers:
        - name: web
          image: quay.io/ricardo_instructor_formacion/cooperativa-web:web-1.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: curso-t2
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: panel
  labels:
    app: panel
spec:
  selector:
    app: panel
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: panel
  labels:
    app: panel
spec:
  to:
    kind: Service
    name: panel
  port:
    targetPort: http
