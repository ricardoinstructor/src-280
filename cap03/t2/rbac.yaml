apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: desplegador
  namespace: curso-t2
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cooperativa-dev-desplegador
  namespace: curso-t2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: desplegador
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: cooperativa-dev
